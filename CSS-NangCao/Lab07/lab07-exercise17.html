<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <title>Exercise 7.17 - Filters</title>
  <link rel="stylesheet" href="css/lab07.css">
  <link rel="stylesheet" href="css/lab07-exercise17.css">
</head>
<body>
<header class="lab-title">
  <p>Lab 07 &middot; Advanced CSS: Layout</p>
  <h1>Exercise 7.17 &mdash; Filters</h1>
</header>
<aside class="note" lang="vi">Cùng một ảnh áp dụng các hàm <code>filter</code>: saturate, grayscale, contrast, brightness, blur, invert, sepia, hue-rotate, opacity và một tổ hợp. Rê chuột vào ảnh để so với ảnh gốc.</aside>

<div class="demo">
  <div class="filters">
    <figure class="none"><img src="images/5856697109.jpg" alt=""><figcaption>original</figcaption></figure>
    <figure class="saturate"><img src="images/5856697109.jpg" alt=""><figcaption>saturate(250%)</figcaption></figure>
    <figure class="grayscale"><img src="images/5856697109.jpg" alt=""><figcaption>grayscale(100%)</figcaption></figure>
    <figure class="contrast"><img src="images/5856697109.jpg" alt=""><figcaption>contrast(180%)</figcaption></figure>
    <figure class="brightness"><img src="images/5856697109.jpg" alt=""><figcaption>brightness(150%)</figcaption></figure>
    <figure class="blur"><img src="images/5856697109.jpg" alt=""><figcaption>blur(3px)</figcaption></figure>
    <figure class="invert"><img src="images/5856697109.jpg" alt=""><figcaption>invert(100%)</figcaption></figure>
    <figure class="sepia"><img src="images/5856697109.jpg" alt=""><figcaption>sepia(100%)</figcaption></figure>
    <figure class="huerotate"><img src="images/5856697109.jpg" alt=""><figcaption>hue-rotate(120deg)</figcaption></figure>
    <figure class="opacity"><img src="images/5856697109.jpg" alt=""><figcaption>opacity(40%)</figcaption></figure>
    <figure class="combo"><img src="images/5856697109.jpg" alt=""><figcaption>grayscale+contrast+brightness</figcaption></figure>
  </div>
</div>

<script src="../js/labnav.js" defer></script>
</body>
</html>
