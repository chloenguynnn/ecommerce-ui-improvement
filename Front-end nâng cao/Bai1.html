<!DOCTYPE html>
<html>
  <head>
    <title>Tạo responsive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      .left,
      .right {
        height: 400px;
      }

      .left {
        background: blue;
        float: left;
        width: 70%;
      }

      .right {
        background: red;
        float: right;
        width: 30%;
      }

      @media only screen and (max-width: 768px) {
        .left, .right {
          width: 100%;
        }
      }

      /* Nếu chiều rộng của trình duyệt từ 320px đến 480px thì ẩn class Right */
      @media only screen and (max-width: 479px) and (min-width: 321px) {
        .right {
          display: none;
        }
      }

      /* Nếu ở chế độ máy in thì ẩn class Left */
      @media only print {
        .left {
          display: none;
        }
        .right {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        LEFT
        <picture>
          <!-- Bự nhất (>= 1000px): Logo UEH -->
          <source media="(min-width: 1000px)" srcset="https://www.ueh.edu.vn/images/logo-header.png">
          
          <!-- Kéo vô (600px - 999px): Logo CTD (đã thay link mới sống 100%) -->
          <source media="(min-width: 600px)" srcset="https://ctd.ueh.edu.vn/wp-content/uploads/2023/07/cropped-TV_trang_CTD.png">
          
          <!-- Kéo vô nữa (< 600px): Logo BIT -->
          <img alt="Logo" width="400" src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png">
        </picture>
      </div>
      <div class="right">RIGHT</div>
    </div>
  </body>
</html>
